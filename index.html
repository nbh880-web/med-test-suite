const RUBRIC=`אתה פסיכולוג בכיר ממיין לרפואה עם 20 שנות ניסיון במו"ר, מרק"ם, מר"ב, צפת ובן-גוריון. הערך תשובה ביוגרפית לפי המחוון המדויק למטה, המבוסס על 11 הקריטריונים הרשמיים של מאל"ו, מודל HEXACO, ומכון נועם. דבר עברית. היה ישיר ומחמיר. אל תחמיא.

============ הוראות יסוד (קרוא לפני שאתה מעריך) ============

1. ציטוט חובה: כל note שאתה כותב חייב לצטט מילה או משפט מהתשובה של המועמד. "רפלקציה רדודה" אסור. "'המוכנות לעמוד במתח' היא סיסמה גנרית" מותר. note בלי ציטוט = לא תקין.

2. אל תמציא: ב-rewrite_suggestion אסור להוסיף מיקום, תאריך, שם, מספר, או פרט שלא הופיע בטקסט המקורי. אם חסר פרט, כתוב [מיקום] או השמט. תקן את הטקסט — אל תמציא סיפור חדש.

3. היה מחמיר: הציון הממוצע של מועמד אמיתי הוא 55-70. ציון 75 הוא "טוב עם פערים קונקרטיים", לא "טוב מאוד". ציון 85+ דורש תשובה יוצאת דופן בכל הקריטריונים. אל תעגל כלפי מעלה.

4. מבחן ההחלפה: אם אפשר להחליף את שם המועמד בשם של מישהו אחר והתשובה עדיין נשמעת אותו הדבר — היא כללית מדי. ציין זאת במפורש.

5. שאלת הסיום הגדולה: לפני שאתה נותן total_score, שאל את עצמך: "האם הייתי רוצה שהאדם הזה יהיה הרופא שלי או של המשפחה שלי ברגע משבר?" אם לא — הציון לא יכול להיות מעל 75.

6. הבחן בין ביקורת עצמית בוגרת (מאל"ו מעריכים, פריט 10) לבין הלקאה עצמית הרסנית. "תהיתי אם המניע שלי היה נכון" = בוגר. "זה היה חוסר ביטחון" על פעולה נכונה = הלקאה, ציין כמוקש.

7. המוסד ניתן לך רק לצורך פורמט ומגבלת אורך. אל תצפה שהמועמד יציג "זיקה" למוסד — הוא מועמד, לא בוגר. אם הוא מזכיר במפורש את שם המוסד כדי להתחנף — זה דגל (תשובה מלאכותית).

============ חלק א: טכני ורלוונטיות (20 נק') ============

1. עמידה במגבלת אורך (5): המגבלה ניתנה ב-prompt. חורג = -2. קצר משמעותית מהמגבלה = -2.

2. רלוונטיות כרונולוגית (5): אירוע חייב להיות אחרי תיכון (צבא, ש"ל, עבודה, לימודים, התנדבות בוגרת). אירוע מהתיכון/ילדות = 0/5.

3. מענה מלא (5): קרא את השאלה שוב. כל תת-סעיף (מה קרה, מה הרגשת, מה עשית, מה למדת) חייב להיענות. סעיף חסר = -1.

4. ייחודיות וחוסר קלישאה (5): "התנדבות במיון" = קלישאה; "ההזדקנות של סבא" = קלישאה. אפשר נושא שחוק עם זווית חדה ולקבל 4. נושא שחוק + זווית שחוקה = 2/5.

============ חלק ב: נרטיב — STAR + רגש ומחשבה (30 נק') ============

1. מבנה STAR (10):
   - מצב: ברור, ממוקם בזמן ומקום?
   - משימה/קונפליקט: ברור מה היה הקושי האמיתי (לא "היה לחוץ")?
   - פעולה: פעלים אקטיביים בגוף ראשון ("יזמתי", "בחרתי", "פניתי"), לא "קרה ש"?
   - תוצאה: ברורה? (לא חייבת להיות הצלחה)

   4 שאלות הבדיקה: (1) בודק שהיה באירוע היה מזהה אותו מהתיאור? (2) ברור מה היה קשה או שזה נשמע קל מדי? (3) ברור מה אתה לוקח מזה? (4) ענית על השאלה שנשאלה או סיפרת סיפור שאהוב עליך?

2. רציונל וחשיבה פנימית (10): האם הסברת למה פעלת כך? מה שקלת? מה החלופות? תשובה ללא "למה" = מקסימום 5/10.

3. בהירות וכתיבה (10): שפה מדויקת, ללא שגיאות כתיב (בלבול "אורח/אורך", "מנטר/מנתר"), פיסוק, לא מליצי ולא עילג. שגיאת כתיב אחת = -2.

   **בונוס "רגש ומחשבה":** אם המועמד מתאר גם רגש שחש (לחץ, התלבטות, פחד, גאווה) וגם מחשבה שעברה בראשו באותו רגע — זה מוסיף +2. טקסט שכולל רק "מה עשיתי" בלי פנימיות = -2.

============ חלק ג: פרופיל פסיכולוגי — 50 נק' ============

**1. כנות וענווה (15 נק'):**
- אחריות מלאה, בלי "אבל", בלי להאשים נסיבות?
- הודאה בטעות אמיתית, לא קוסמטית ("הייתי קצת לחוץ") כדי להיראות צנוע?
- אין "גיבורי-על" ("הצלתי לבד")?
- ביקש עזרה כשצריך?
- "האדרה עצמית מוסווית" (להציג התנדבות כדי להיראות טוב) = -3.
- דגל: "החולשה שלי היא פרפקציוניזם" = תשובה כוזבת, -3.

**2. רפלקציה ותובנה (15 נק') — הממד הקריטי ביותר. היה מחמיר:**

מבחן הסיפור-האחר: קח את הלקח שהמועמד כתב. האם הוא יכול להיכתב על סיפור אחר לגמרי? אם כן — גנרי. אם רק על הסיפור הזה — אמיתי.

סולם:
* 0-4: לקח גנרי/סיסמה. "למדתי שחשוב להקשיב", "הבנתי את ערך הצוות", "המוכנות לעמוד במתח", "רפואה זה לא רק טכניקה".
* 5-8: לקח אישי אבל חיצוני, או בלי שינוי התנהגותי. "למדתי שאני נוטה להיסחף" — מה עשית עם זה?
* 9-11: לקח ספציפי + חיבור לחולשה אישית. חסר שינוי התנהגותי או קישור קונקרטי לרפואה.
* 12-15: מבנה תלת-חלקי מלא — (א) "עד אז חשבתי ש..." (ב) "הבנתי ש..." (ג) "מאז אני...". חיבור ספציפי (לא כללי) לרפואה עתידית.

דגל: אם מסתיים ב"זה מה שעושה רופא טוב" או סיסמה — הורד ל-6 מקסימום.

**3. אמפתיה ונעימות (10 נק') — הממד השני בחשיבות:**

5 בדיקות:
א. Perspective-taking: המועמד מתאר את הסיטואציה מנקודת מבט של האחר, או רק רגש של עצמו? "הרגשתי רע בשבילה" = רגש עצמי. "הבנתי שמבחינתה הרעש היה מפחיד" = perspective-taking.

ב. Patient-centered vs self-centered: האם הפעולה לצורך של השני, או להרגעת חוסר נוחות של המועמד? אם המועמד כותב "הרגשתי שאני חייב לעשות משהו" = self-centered.

ג. זיהוי צורך מעבר לרגש הגלוי: לא רק "פחדה" אלא "פחדה כי לא הבינה מה קורה".

ד. פעולה מותאמת לצורך שזוהה (לא סתם "נחמדות").

ה. חמלה אקטיבית (לא רק "נחמדות"): האם המועמד יודע להציב גבולות כשצריך, או שחמלה = לעשות מה שנעים? רופא חומל יודע לומר לא.

בקונפליקט/דילמה: האם המועמד רואה גם את הצד השני (המפקד, הצוות, המשפחה)? אמפתיה בוגרת כוללת את מי שלא נוח.

מוקש קריטי: אם המועמד ביצע פעולה אמפתית ואז פירש אותה בעצמו כ"חוסר ביטחון" — זו הלקאה עצמית, לא ענווה. הפעולה נכונה. ציין במפורש ב-note: "פירשת פעולה אמפתית כחולשה. זה ייחוס שגוי."

**4. חוסן ומצפוניות (10 נק'):**
- הקושי אמיתי ומשמעותי, או קוסמטי ("היה חם", "הייתי עייף")?
- המועמד התמיד או עזב ברגע הקשה?
- יוזמה אקטיבית (מאל"ו פריט 7 — משקל גבוה), לא רק ביצוע: האם המועמד קידם את העניינים או רק הגיב?
- ויסות רגשי: תפקוד בלחץ? פאניקה מתוארת = דגל. "דריכות והתעשתות" = חיוב.
- השהיית תגובה: האם המועמד מראה רגע של חשיבה לפני פעולה? "עצרתי לחשוב לפני שפעלתי" = בוגר. תגובה אוטומטית/מיידית = פחות בוגר.

============ חלק ד: מוקשים (עונש -3 עד -20 מהציון הכולל) ============

1. **המצאה/הגזמה**: "הצלתי חיים" ללא פרטים, סיפור שנשמע מומצא. -5 עד -15.
2. **האשמת אחרים**: "המפקד גרוע", "הצוות לא הקשיב", "הוא נעלב כי רגיש". -5 עד -15.
3. **הלקאה עצמית**: לייחס פעולה נכונה ל"חוסר ביטחון". -3 עד -7.
4. **לא עונה על השאלה**: שאלו על כישלון, ענית על הצלחה. -5 עד -10.
5. **חוסר רגישות**: תיאור קר, שיפוטיות ("עצלן", "הגזימה"). -5 עד -10.
6. **האדרה עצמית**: "הייתי היחיד ש...", בלי הוכחה. -3 עד -7.
7. **"אנחנו" במקום "אני"**: שימוש חוזר בלי לציין מה אתה עשית. -3.
8. **קלישאה + חוסר זווית**: נושא שחוק *וגם* זווית שחוקה. -3.
9. **ביטחון יתר / absence of doubt**: אין שום התלבטות, תהייה, חרטה. -5.
10. **תשובה משוננת/"מושלמת מדי"**: נשמעת כמו שנכתבה מראש. אין שום רגע פגיעות אנושית. -3 עד -7.
11. **הבנת מציאות (מאל"ו פריט 8)**: תיאור דרמטי מדי או אידיאלי מדי מול מה שסביר שקרה. -3.
12. **פרפקציוניזם כ"חולשה"**: תשובה כוזבת קלאסית. -3.
13. **הזכרת שם המוסד בחנופה**: "אני רוצה ללמוד דווקא ב-X כי...". -3.

============ פלט חובה ============

    const bgSetCv=(i,f,v)=>setBgCv(p=>p.map((x,j)=>j===i?{...x,[f]:v}:x));
    const bgSaveCv=async()=>{
        if(!db){alert('אין חיבור למסד.');return}
        setBgCvBusy(true);
        try{await db.collection('profile').doc('bguCv').set({cv:bgCv,recs:bgRecs,updated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});LOG('ok','קו"ח בן-גוריון נשמר')}
        catch(e){LOG('error','שמירת קו"ח נכשלה: '+(e.code||'')+' — '+(e.message||e));alert('שגיאה בשמירה')}
        setBgCvBusy(false);
    };
    const bgAnalyzeCv=async(i)=>{
        const item=bgCv[i];const uI=UNIS.bgu;
        if(!item.a||item.a.trim().length<20){alert('כתוב תשובה מלאה לשאלה זו.');return}
        setBgCvAnalyzing(i);LOG('info','מנתח קו"ח בן-גוריון — שאלה '+(i+1));
        const answerText='שאלה: '+(item.q||'')+'\nתשובה: '+item.a;
        const prompt='Institution: '+uI.name+'\nFormat: '+uI.format+'\nTraits: '+uI.traits+'\nType: BIOGRAPHICAL\n'+answerText;
        try{
            const pr=[];
            if(keys.CLAUDE)pr.push(fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,system:RUBRIC})}).then(async r=>{const d=await r.json();if(!r.ok||d.error)return{s:'c',d:null};return{s:'c',d}}).catch(()=>({s:'c',d:null})));
            if(keys.GEMINI)pr.push(fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,system:RUBRIC})}).then(async r=>{const d=await r.json();if(!r.ok||d.error)return{s:'g',d:null};return{s:'g',d}}).catch(()=>({s:'g',d:null})));
            const raw=await Promise.allSettled(pr);const P={claude:null,gemini:null};
            raw.forEach(r=>{if(r.status!=='fulfilled'||!r.value.d)return;const v=r.value;try{if(v.s==='c'){const t=v.d.content?v.d.content[0].text:(v.d.text||'');P.claude=pj(t)}if(v.s==='g')P.gemini=pj(v.d.candidates?.[0]?.content?.parts?.[0]?.text||'')}catch(_){}}); 
            const scores=[];if(P.claude&&P.claude.total_score!=null)scores.push(P.claude.total_score);if(P.gemini&&P.gemini.total_score!=null)scores.push(P.gemini.total_score);
            const avg=scores.length?Math.round(scores.reduce((a,b2)=>a+b2,0)/scores.length):null;
            const analysis={claudeResult:P.claude||null,geminiResult:P.gemini||null,avgScore:avg};
            const newCv=bgCv.map((x,j)=>j===i?{...x,analysis}:x);setBgCv(newCv);
            await db.collection('profile').doc('bguCv').set({cv:newCv,recs:bgRecs},{merge:true});
            LOG('ok','ניתוח קו"ח נשמר (ציון: '+(avg!=null?avg:'—')+')');
            if(!P.claude&&!P.gemini)alert('הניתוח לא חזר. נסה שוב.');
        }catch(e){LOG('error','ניתוח קו"ח נכשל: '+(e.message||e));alert('שגיאה בניתוח')}
        setBgCvAnalyzing(null);
    };

    // ===== פונקציות "התשובות שלי" =====
    const bioReset=()=>{setBioMainQ('');setBioMainAns('');setBioSecs([]);setBioEditId(null);setBioUni(uni)};
    const bioAddSec=()=>setBioSecs(p=>[...p,{sub:'',ans:''}]);
    const bioDelSec=(i)=>setBioSecs(p=>p.filter((_,x)=>x!==i));
    const bioSetSec=(i,f,v)=>setBioSecs(p=>p.map((s,x)=>x===i?{...s,[f]:v}:s));
    const bioEdit=(b)=>{setBioEditId(b.id);setBioUni(b.uni||'tzfat');setBioMainQ(b.mainQ||'');setBioMainAns(b.mainAns||'');setBioSecs(b.sections||[]);setView('bios');window.scrollTo(0,0)};
    const bioSave=async()=>{
        if(!bioMainQ.trim()){alert('כתוב את השאלה הראשית.');return}
        const hasSecs=bioSecs.length>0;
        if(hasSecs){if(!bioSecs.some(s=>s.ans.trim())){alert('כתוב תשובה לפחות בסעיף אחד.');return}}
        else if(!bioMainAns.trim()){alert('כתוב תשובה.');return}
        if(!db){alert('אין חיבור למסד.');return}
        setBioBusy(true);
        const clean=bioSecs.filter(s=>s.sub.trim()||s.ans.trim());
        const rec={uni:bioUni,mainQ:bioMainQ.trim(),mainAns:hasSecs?'':bioMainAns.trim(),sections:clean,created:firebase.firestore.FieldValue.serverTimestamp()};
        try{
            if(bioEditId){await db.collection('bioAnswers').doc(bioEditId).set(rec,{merge:true});LOG('ok','תשובה עודכנה')}
            else{await db.collection('bioAnswers').add(rec);LOG('ok','תשובה נשמרה')}
            const s=await db.collection('bioAnswers').get();const b=[];s.forEach(d=>b.push({id:d.id,...d.data()}));b.sort((a,b2)=>tsv(b2.created)-tsv(a.created));setBios(b);
            bioReset();
        }catch(e){LOG('error','שמירת תשובה נכשלה: '+(e.code||'')+' — '+(e.message||e));alert('שגיאה בשמירה')}
        setBioBusy(false);
    };
    const bioDel=async(id)=>{if(!confirm('למחוק את התשובה?'))return;try{await db.collection('bioAnswers').doc(id).delete();setBios(p=>p.filter(b=>b.id!==id));LOG('ok','תשובה נמחקה')}catch(e){LOG('error','מחיקה נכשלה: '+(e.message||e))}};
    const bioText=(b)=>{let t='שאלה: '+(b.mainQ||'')+'\n';if(b.sections&&b.sections.length){(b.sections||[]).forEach(s=>{if(s.sub.trim())t+='\nתת-שאלה: '+s.sub+'\n';t+='תשובה: '+s.ans+'\n'})}else{t+='תשובה: '+(b.mainAns||'')+'\n'}return t.trim()};
    const bioAnalyze=async(b)=>{
        const uI=UNIS[b.uni]||UNIS.tzfat;const answerText=bioText(b);
        if(answerText.length<20){alert('התשובה קצרה מדי לניתוח.');return}
        setBioAnalyzing(b.id);LOG('info','מנתח תשובה ממוחשבת — '+uI.name);
        const prompt='Institution: '+uI.name+'\nFormat: '+uI.format+'\nTraits: '+uI.traits+'\nType: BIOGRAPHICAL\n'+answerText;
        try{
            const pr=[];
            if(keys.CLAUDE)pr.push(fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,system:RUBRIC})}).then(async r=>{const d=await r.json();if(!r.ok||d.error)return{s:'c',d:null};return{s:'c',d}}).catch(()=>({s:'c',d:null})));
            if(keys.GEMINI)pr.push(fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,system:RUBRIC})}).then(async r=>{const d=await r.json();if(!r.ok||d.error)return{s:'g',d:null};return{s:'g',d}}).catch(()=>({s:'g',d:null})));
            const raw=await Promise.allSettled(pr);const P={claude:null,gemini:null};
            raw.forEach(r=>{if(r.status!=='fulfilled'||!r.value.d)return;const v=r.value;try{if(v.s==='c'){const t=v.d.content?v.d.content[0].text:(v.d.text||'');P.claude=pj(t)}if(v.s==='g')P.gemini=pj(v.d.candidates?.[0]?.content?.parts?.[0]?.text||'')}catch(_){}}); 
            const scores=[];if(P.claude&&P.claude.total_score!=null)scores.push(P.claude.total_score);if(P.gemini&&P.gemini.total_score!=null)scores.push(P.gemini.total_score);
            const avg=scores.length?Math.round(scores.reduce((a,b2)=>a+b2,0)/scores.length):null;
            const analysis={claudeResult:P.claude||null,geminiResult:P.gemini||null,avgScore:avg,at:Date.now()};
            await db.collection('bioAnswers').doc(b.id).set({analysis},{merge:true});
            setBios(p=>p.map(x=>x.id===b.id?{...x,analysis}:x));
            LOG('ok','ניתוח נשמר (ציון ממוצע: '+(avg!=null?avg:'—')+')');
            if(!P.claude&&!P.gemini)alert('הניתוח לא חזר. נסה שוב.');
        }catch(e){LOG('error','ניתוח תשובה נכשל: '+(e.message||e));alert('שגיאה בניתוח')}
        setBioAnalyzing(null);
    };

    const togRec=()=>{if(isRec&&recO){recO.stop();setIsRec(false);setRecO(null);return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('השתמש בכרום.');return}const r=new SR();r.lang='he-IL';r.continuous=true;r.onresult=e=>{let f='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)f+=e.results[i][0].transcript+' ';if(f)setText(p=>p+' '+f)};r.onerror=()=>{setIsRec(false);setRecO(null)};r.onend=()=>{setIsRec(false);setRecO(null)};r.start();setIsRec(true);setRecO(r)};

    const togMartinRec=async()=>{
        if(isMartinRec&&mRecRef.current){mRecRef.current.stop();setIsMartinRec(false);return}
        if(curARef.current){curARef.current.pause();curARef.current=null}
        try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:true});
            const mr=new MediaRecorder(stream);aChRef.current=[];
            mr.ondataavailable=e=>{if(e.data&&e.data.size>0)aChRef.current.push(e.data)};
            mr.onstop=async()=>{const blob=new Blob(aChRef.current,{type:mr.mimeType||'audio/mp4'});stream.getTracks().forEach(t=>t.stop());if(blob.size<1000){alert('ההקלטה קצרה מדי.');return}await processAudio(blob)};
            mRecRef.current=mr;mr.start();setIsMartinRec(true);
        }catch(e){alert('ודא שאישרת גישה למיקרופון.')}
    };

    const processAudio=async(blob)=>{
        setMLd(true);
        try{
            const reader=new FileReader();reader.readAsDataURL(blob);
            reader.onloadend=async()=>{
                const base64data=reader.result.split(',')[1];
                const mime=blob.type||'audio/mp4';
                const tRes=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audioBase64:base64data,mimeType:mime})});
                const tData=await tRes.json();
                if(!tRes.ok){LOG('error','מרטין/תמלול נכשל: '+(tData.error||tRes.status));alert('שגיאת תמלול: '+(tData.error||''));setMLd(false);return}
                if(!tData.transcript||tData.transcript.trim().length<2){alert('לא שמעתי בבירור.');setMLd(false);return}
                const userText=tData.transcript;
                setChat(p=>[...p,{role:'user',text:userText}]);
                const mRes=await fetch('/api/martin-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userText:userText,chatHistory:[...chat,{role:'user',text:userText}],uni:UNIS[uni].name})});
                const mData=await mRes.json();
                if(!mRes.ok||mData.error){LOG('error','מרטין/תשובה נכשלה: '+(mData.error||mRes.status));alert('מרטין: '+(mData.error||''));setMLd(false);return}
                setChat(p=>[...p,{role:'martin',text:mData.martinText}]);LOG('ok','מרטין ענה');
                if(mData.audioBase64){const snd=new Audio("data:audio/mp3;base64,"+mData.audioBase64);curARef.current=snd;snd.play()}else{speakTTS(mData.martinText)}
                setMLd(false);
            };
        }catch(e){LOG('error','מרטין קולי — שגיאה: '+e.message);alert('שגיאה: '+e.message);setMLd(false)}
    };

    const speakHebrew=(text)=>{if('speechSynthesis' in window){window.speechSynthesis.cancel();const ut=new SpeechSynthesisUtterance(text);ut.lang='he-IL';ut.rate=1.0;window.speechSynthesis.speak(ut)}};
    const speakTTS=async(text)=>{try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})});const d=await r.json();if(d.audioBase64){const snd=new Audio("data:audio/mp3;base64,"+d.audioBase64);curARef.current=snd;snd.play()}else{speakHebrew(text)}}catch(e){speakHebrew(text)}};
    const startMartin=()=>{const q=allQ[Math.floor(Math.random()*allQ.length)];const opening='\u05E9\u05DC\u05D5\u05DD, \u05D0\u05E0\u05D9 \u05DE\u05E8\u05D8\u05D9\u05DF. \u05D0\u05E0\u05D9 \u05DE\u05E8\u05D0\u05D9\u05D9\u05DF \u05D4\u05D9\u05D5\u05DD \u05D1\u05DE\u05D9\u05D5\u05E0\u05D9 \u05D4\u05E7\u05D1\u05DC\u05D4 \u05DC'+UNIS[uni].name+'. \u05D1\u05D5\u05D0 \u05E0\u05EA\u05D7\u05D9\u05DC. '+q.q;setChat([{role:'martin',text:opening}]);setMartinFB(null);setView('martin');setTimeout(()=>speakTTS(opening),500)};

    const endInterview=async()=>{if(chat.length<2){alert('קצר מדי.');return}setMLd(true);try{const tr=chat.map(m=>(m.role==='martin'?'מראיין':'מועמד')+': '+m.text).join('\n');const res=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:tr,system:COMMITTEE})});const d=await res.json();const t=d.candidates?.[0]?.content?.parts?.[0]?.text||'';const p=pj(t);if(p){setMartinFB(p);LOG('ok','סיכום ראיון מרטין התקבל')}else{LOG('error','סיכום ראיון — פענוח JSON נכשל');alert('שגיאה בפענוח.')}}catch(e){LOG('error','סיכום ראיון נכשל: '+(e.message||e));alert('שגיאה.')}finally{setMLd(false)}};

    const analyze=async()=>{
        if(text.length<20){alert('כתוב תשובה מלאה.');return}
        setLoading(true);setResults(null);
        const qText=qIdx!==null?allQ[qIdx].q:'';
        const isCreative=qIdx!==null&&allQ[qIdx].c==='cre';
        const activeRubric=isCreative?CREATIVE_RUBRIC:RUBRIC;
        const limMode=customLimitMode||(isCreative?'words':'chars');
        const limNum=customLimitNum?parseInt(customLimitNum):(limMode==='words'?350:uI.limit);
        const limStr=limNum+' '+(limMode==='words'?'מילים':'תווים');
        const prompt='Institution: '+uI.name+'\nFormat: '+uI.format+'\nLimit: '+limStr+'\nTraits: '+uI.traits+'\n'+(qText?'Question: '+qText+'\n':'')+'\nType: '+(isCreative?'CREATIVE-IMAGINATIVE':'BIOGRAPHICAL')+'\nAnswer:\n'+text;
        try{
            LOG('info','מתחיל ניתוח כתוב — מנועים: '+[keys.CLAUDE&&'Claude',keys.GEMINI&&'Gemini',keys.GPT&&'GPT'].filter(Boolean).join(', '));
            const pr=[];
            if(keys.CLAUDE)pr.push(fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,system:activeRubric})}).then(async r=>{const d=await r.json();if(!r.ok||d.error){const e=typeof d.error==='string'?d.error:(d.error?.message||JSON.stringify(d.error));return{s:'c',d:null,err:e}}return{s:'c',d}}).catch(e=>({s:'c',d:null,err:e.message})));
            if(keys.GEMINI)pr.push(fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,system:activeRubric})}).then(async r=>{const d=await r.json();if(!r.ok||d.error){const e=typeof d.error==='string'?d.error:(d.error?.message||JSON.stringify(d.error));return{s:'g',d:null,err:e}}return{s:'g',d}}).catch(e=>({s:'g',d:null,err:e.message})));
            if(keys.GPT)pr.push(fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+keys.GPT},body:JSON.stringify({model:'gpt-4o',temperature:.3,messages:[{role:'system',content:activeRubric},{role:'user',content:prompt}]})}).then(async r=>{const d=await r.json();if(!r.ok||d.error){return{s:'o',d:null,err:d.error?.message||JSON.stringify(d.error)}}return{s:'o',d}}).catch(e=>({s:'o',d:null,err:e.message})));
            const raw=await Promise.allSettled(pr);
            const P={gemini:null,claude:null,gpt:null};
            const errors=[];
            raw.forEach(r=>{if(r.status!=='fulfilled')return;const v=r.value;
                if(v.err){var e=typeof v.err==='string'?v.err:JSON.stringify(v.err);errors.push((v.s==='g'?'Gemini':v.s==='c'?'Claude':'GPT')+': '+e);return}
                if(!v.d)return;
                try{
                    if(v.s==='g')P.gemini=pj(v.d.candidates?.[0]?.content?.parts?.[0]?.text||'');
                    if(v.s==='c'){const t=v.d.content?v.d.content[0].text:(v.d.text||'');P.claude=pj(t);if(!P.claude)errors.push('Claude: JSON parse failed')}
                    if(v.s==='o')P.gpt=pj(v.d.choices?.[0]?.message?.content||'');
                }catch(e){errors.push('Parse error: '+e.message)}});
            setResults(P);
            LOG('info','תוצאות ניתוח — Claude:'+(P.claude?'התקבל':'ריק')+' / Gemini:'+(P.gemini?'התקבל':'ריק')+' / GPT:'+(P.gpt?'התקבל':'ריק'));
            if(errors.length>0)LOG('error','שגיאות ניתוח: '+errors.join(' | '));
            if(P.claude)setTab('claude');else if(P.gemini)setTab('gemini');else if(P.gpt)setTab('gpt');
            if(errors.length>0)alert('שגיאות:\n'+errors.join('\n'));

            if(db){
                try{
                    const scores={};
                    if(P.claude)scores.claude=P.claude.total_score;
                    if(P.gemini)scores.gemini=P.gemini.total_score;
                    if(P.gpt)scores.gpt=P.gpt.total_score;
                    const avg=Object.values(scores).length?Math.round(Object.values(scores).reduce((a,b)=>a+b,0)/Object.values(scores).length):0;
                    const qCat=qIdx!==null?allQ[qIdx].c:'';
                    await db.collection('evaluations').add({content:text,question:qText,qCategory:qCat,uni:uni,scores:scores,avgScore:avg,claudeResult:P.claude||null,geminiResult:P.gemini||null,gptResult:P.gpt||null,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
                    const snap=await db.collection('evaluations').get();
                    const h=[];snap.forEach(d=>h.push({id:d.id,...d.data()}));h.sort((a,b)=>tsv(b.timestamp)-tsv(a.timestamp));setHist(h.slice(0,200));LOG('ok','התוצאה נשמרה להיסטוריה ('+h.length+' רשומות)');
                }catch(e){LOG('error','שמירה להיסטוריה נכשלה: '+(e.code||'')+' — '+(e.message||e))}
            }
        }catch(e){alert('שגיאה.')}finally{setLoading(false)}
    };

    const addCQ=()=>{if(!nq.q.trim())return;const n={c:nq.c,t:nq.t||'מותאם',q:nq.q.trim(),custom:true};setCQs(p=>[...p,n]);if(db)db.collection('customQuestions').add({...n,created:firebase.firestore.FieldValue.serverTimestamp()});setNq({c:'bio',t:'',q:''});setShowAQ(false)};
    const delCQ=i=>{const q=cQs[i];setCQs(p=>p.filter((_,j)=>j!==i));if(db&&q.id)db.collection('customQuestions').doc(q.id).delete()};

    const debugUI=(<Fragment>
        <button onClick={()=>setShowLog(v=>!v)} title="דיווחי בעיות" style={{position:'fixed',bottom:14,right:14,zIndex:9999,background:'#0f172a',color:'#fff',fontWeight:800,fontSize:12,padding:'8px 12px',borderRadius:20,boxShadow:'0 4px 14px rgba(0,0,0,.25)',border:'none',cursor:'pointer'}}>דיווחים{logs.filter(l=>l.type==='error').length>0?' ('+logs.filter(l=>l.type==='error').length+')':''}</button>
        {showLog&&<div style={{position:'fixed',bottom:62,right:14,zIndex:9999,width:'min(380px,92vw)',maxHeight:'55vh',background:'#0f172a',color:'#e2e8f0',borderRadius:14,boxShadow:'0 8px 30px rgba(0,0,0,.4)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px',borderBottom:'1px solid #334155'}}>
                <span style={{fontWeight:800,fontSize:13}}>דיווחי בעיות ({logs.length})</span>
                <div style={{display:'flex',gap:6}}>
                    <button onClick={()=>{var txt=logs.map(l=>'['+l.ts+'] '+l.type+': '+l.msg).join('\n');try{navigator.clipboard.writeText(txt);LOG('info','הלוג הועתק ללוח')}catch(_){}}} style={{background:'#1d4ed8',color:'#fff',border:'none',borderRadius:8,padding:'4px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}}>העתק</button>
                    <button onClick={()=>{LOGBUF.length=0;setLogs([])}} style={{background:'#334155',color:'#fff',border:'none',borderRadius:8,padding:'4px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}}>נקה</button>
                    <button onClick={()=>setShowLog(false)} style={{background:'transparent',color:'#94a3b8',border:'none',fontSize:16,cursor:'pointer',lineHeight:1}}>✕</button>
                </div>
            </div>
            <div className="sc" style={{overflowY:'auto',padding:'8px 12px',fontSize:11,lineHeight:1.6,direction:'ltr',textAlign:'left'}}>
                {logs.length===0?<div style={{color:'#64748b'}}>אין דיווחים עדיין…</div>:logs.map((l,i)=><div key={i} style={{color:l.type==='error'?'#fca5a5':(l.type==='ok'?'#86efac':'#cbd5e1'),marginBottom:4,whiteSpace:'pre-wrap',wordBreak:'break-word'}}>[{l.ts}] {l.msg}</div>)}
            </div>

            {hist.length>0&&<div className="mb-8">
                <div className="flex justify-between items-center mb-3"><h3 className="text-lg font-bold text-slate-800">&#128200; היסטוריה ({filteredH.length}/{hist.length})</h3><button onClick={()=>setHStarOnly(!hStarOnly)} className={'text-xs font-bold px-4 py-2 rounded-full '+(hStarOnly?'bg-yellow-100 text-yellow-700 border border-yellow-300':'bg-slate-100 text-slate-500')}>{hStarOnly?'\u2605 מועדפים':'\u2606 מועדפים'}</button></div>
                <div className="flex gap-2 mb-2 flex-wrap"><input value={hSearch} onChange={e=>setHSearch(e.target.value)} placeholder="&#128269; חיפוש..." className="flex-1 min-w-[120px] bg-white border rounded-xl px-3 py-2 text-sm"/><select value={hFilter} onChange={e=>setHFilter(e.target.value)} className="bg-white border rounded-xl px-3 py-2 text-sm font-bold"><option value="all">כל המוסדות</option>{Object.entries(UNIS).map(([k,v])=><option key={k} value={k}>{v.name}</option>)}</select></div>
                <div className="flex gap-2 mb-3 flex-wrap items-center"><span className="text-xs text-slate-500 font-bold">מתאריך</span><input type="date" value={hDateFrom} onChange={e=>setHDateFrom(e.target.value)} className="bg-white border rounded-xl px-2 py-2 text-xs"/><span className="text-xs text-slate-500 font-bold">עד</span><input type="date" value={hDateTo} onChange={e=>setHDateTo(e.target.value)} className="bg-white border rounded-xl px-2 py-2 text-xs"/><select value={hCatFilter} onChange={e=>setHCatFilter(e.target.value)} className="bg-white border rounded-xl px-3 py-2 text-xs font-bold"><option value="all">כל התגיות</option>{Object.entries(CN).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select><select value={hScoreFilter} onChange={e=>setHScoreFilter(e.target.value)} className="bg-white border rounded-xl px-3 py-2 text-xs font-bold"><option value="all">כל הציונים</option><option value="high">80+ מצוין</option><option value="mid">60-79 סביר</option><option value="low">מתחת 60</option></select>{(hFilter!=='all'||hDateFrom||hDateTo||hScoreFilter!=='all'||hCatFilter!=='all'||hStarOnly||hSearch)&&<button onClick={()=>{setHFilter('all');setHDateFrom('');setHDateTo('');setHScoreFilter('all');setHCatFilter('all');setHStarOnly(false);setHSearch('')}} className="text-xs text-red-500 font-bold bg-red-50 px-3 py-2 rounded-xl">&#10005; נקה</button>}</div>
                {filteredH.length===0&&<div className="text-center text-slate-400 py-6 text-sm font-bold">אין תוצאות</div>}
                <div className="space-y-2 max-h-[500px] overflow-y-auto sc">{filteredH.map((h,i)=>{const hasR=h.geminiResult||h.claudeResult||h.gptResult;const avg=h.avgScore||null;return <div key={i} className={'bg-white p-4 rounded-xl border cursor-pointer hover:border-orange-300 transition-all '+(hasR?'':'opacity-60')} onClick={()=>{setHistDetail(h);setView('histDetail')}}>
                    <div className="flex justify-between items-start">
                        <div className="flex-1">
                            <div className="flex items-center gap-2"><button onClick={(e)=>toggleStar(h,e)} className="text-lg leading-none">{h.starred?'\u2605':'\u2606'}</button><span className="text-sm font-bold text-slate-800">{UNIS[h.uni]?.name||h.uni}</span>{h.qCategory&&CN[h.qCategory]&&<span className="px-2 py-0.5 rounded text-xs font-bold text-white" style={{background:CC[h.qCategory]}}>{CN[h.qCategory]}</span>}{avg&&<span className="text-xs font-black px-2 py-0.5 rounded-full" style={{background:sC(avg)+'20',color:sC(avg)}}>{avg}/100</span>}</div>
                            {h.question&&<div className="text-xs text-orange-600 mt-1 font-bold">{h.question.substring(0,60)}</div>}
                            <div className="text-xs text-slate-400 mt-1">{h.content?.substring(0,80)}</div>
                        </div>
                        <div className="flex flex-col items-end shrink-0 mr-3"><div className="text-xs text-slate-400">{h.timestamp?.toDate?.()?.toLocaleDateString('he-IL')||''}</div>{hasR?<span className="text-xs text-green-600 font-bold mt-1">&#128065; צפה</span>:<span className="text-xs text-slate-300 mt-1">אין חו"ד</span>}</div>
                    </div>
                    {h.scores&&<div className="flex gap-2 mt-2">{h.scores.claude&&<span className="text-xs bg-slate-100 px-2 py-0.5 rounded">Claude: {h.scores.claude}</span>}{h.scores.gemini&&<span className="text-xs bg-slate-100 px-2 py-0.5 rounded">Gemini: {h.scores.gemini}</span>}{h.scores.gpt&&<span className="text-xs bg-slate-100 px-2 py-0.5 rounded">GPT: {h.scores.gpt}</span>}</div>}
                </div>})}</div>
            </div>}
        </div>}

        {(view==='multi'||view==='timed')&&<div className="flex flex-col lg:flex-row gap-6 fi" style={{minHeight:'calc(100vh-140px)'}}>
            <div className="w-full lg:w-1/2 flex flex-col gap-4">
                {view==='timed'&&<div className="bg-slate-800 text-white p-5 rounded-2xl flex justify-between items-center shadow-lg"><div><div className="text-xs text-slate-400 font-bold mb-1">{tMode==='down'?'נותר':'עבר'}</div><div className={'text-3xl font-mono font-black '+(tMode==='down'&&timer<30?'text-red-400':'')}>{fmt(timer)}</div></div><div className="flex gap-2 flex-wrap">{!tOn?<Fragment><button onClick={()=>{setTMode('up');setTimer(0);setTOn(true)}} className="bg-orange-600 px-4 py-2 rounded-xl text-sm font-bold">ספירה</button><button onClick={()=>{setTMode('down');setTimer(120);setTOn(true)}} className="bg-slate-600 px-3 py-2 rounded-xl text-xs font-bold">2 דק</button><button onClick={()=>{setTMode('down');setTimer(300);setTOn(true)}} className="bg-slate-600 px-3 py-2 rounded-xl text-xs font-bold">5 דק</button><button onClick={()=>{setTMode('down');setTimer(600);setTOn(true)}} className="bg-slate-600 px-3 py-2 rounded-xl text-xs font-bold">10 דק</button></Fragment>:<Fragment><button onClick={()=>setTOn(false)} className="bg-yellow-600 px-4 py-2 rounded-xl text-sm font-bold">עצור</button><button onClick={()=>{setTOn(false);setTimer(0)}} className="bg-red-600 px-4 py-2 rounded-xl text-sm font-bold">אפס</button></Fragment>}</div></div>}
                <div className="bg-slate-50 border rounded-xl p-3 flex justify-between text-xs"><span className="font-bold text-slate-600">{uI.name}</span><span className="text-slate-400">{uI.format}</span></div>
                {qIdx!==null&&<div className="border rounded-2xl p-4 flex items-start gap-3" style={{background:CBG[allQ[qIdx].c],borderColor:CC[allQ[qIdx].c]}}><span className="px-2 py-0.5 rounded text-xs font-bold text-white shrink-0" style={{background:CC[allQ[qIdx].c]}}>{CN[allQ[qIdx].c]}</span><p className="text-sm flex-1" style={{color:CC[allQ[qIdx].c]}}>{allQ[qIdx].q}</p><button onClick={pickQ} className="text-xs shrink-0 opacity-60 hover:opacity-100">&#8635;</button></div>}
                <div className="flex-1 flex flex-col bg-white rounded-2xl border shadow-sm overflow-hidden"><div className="px-4 py-3 border-b bg-slate-50 flex justify-between items-center gap-2"><span className="text-xs font-bold text-slate-400">כתיבה / תמלול</span><div className="flex items-center gap-1">{(()=>{const mode=customLimitMode||(qIdx!==null&&allQ[qIdx].c==='cre'?'words':'chars');const lim=customLimitNum?parseInt(customLimitNum):(mode==='words'?350:uI.limit);const cur=mode==='words'?text.trim().split(/\s+/).filter(Boolean).length:text.length;const over=cur>lim;return <span className={'text-xs font-bold '+(over?'text-red-500':'text-slate-400')}>{cur}/{lim} {mode==='words'?'מילים':'תווים'}{over&&' ⚠️'}</span>})()}<select value={customLimitMode} onChange={e=>{setCustomLimitMode(e.target.value);if(!customLimitNum)setCustomLimitNum(e.target.value==='words'?'350':'850')}} className="bg-slate-100 border rounded-lg px-1 py-1 text-xs w-16"><option value="">אוטו</option><option value="chars">תווים</option><option value="words">מילים</option></select>{customLimitMode&&<input type="number" value={customLimitNum} onChange={e=>setCustomLimitNum(e.target.value)} className="bg-slate-100 border rounded-lg px-2 py-1 text-xs w-16 text-center" placeholder="כמה"/>}</div></div><textarea className="flex-1 w-full p-5 outline-none text-base leading-relaxed resize-none sc" style={{minHeight:220}} placeholder="הקלד או הדבק..." value={text} onChange={e=>setText(e.target.value)}/><div className="px-4 py-3 bg-slate-50 border-t flex gap-3"><button onClick={togRec} className={'w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 text-lg '+(isRec?'bg-red-500 text-white rp':'bg-slate-200 hover:bg-slate-300')}>&#127897;</button><button onClick={analyze} disabled={loading} className={'flex-1 py-3 rounded-2xl font-bold text-white '+(loading?'bg-slate-400':'bg-orange-800 hover:bg-orange-900')}>{loading?<span className="flex items-center justify-center gap-2"><span className="ld"></span> בודק...</span>:'\uD83D\uDCCB \u05E9\u05DC\u05D7 \u05DC\u05E0\u05D9\u05EA\u05D5\u05D7'}</button></div></div>
            </div>
            <div className="w-full lg:w-1/2 overflow-y-auto sc pb-10">
                {!results&&!loading&&<div className="h-48 flex flex-col items-center justify-center text-slate-300"><div className="text-5xl mb-3">&#128202;</div><div className="font-bold">הניתוח יופיע כאן</div></div>}
                {results&&<div className="space-y-4 fi">
                    <div className="flex lg:hidden p-1 bg-slate-200 rounded-xl gap-1 mb-2">{['claude','gemini','gpt'].map(m=><button key={m} onClick={()=>setTab(m)} className={'flex-1 py-2 text-xs font-bold rounded-lg '+(tab===m?'bg-white shadow text-orange-800':'text-slate-500')}>{m==='claude'?'Sonnet 4':m==='gemini'?'Gemini':'GPT-4o'}</button>)}</div>
                    <div className={'lg:block '+(tab==='claude'?'block':'hidden')}><RC data={results.claude} name="Claude Sonnet 4"/></div>
                    <div className={'lg:block mt-4 '+(tab==='gemini'?'block':'hidden')}><RC data={results.gemini} name="Gemini 3.1 Pro"/></div>
                    <div className={'lg:block mt-4 '+(tab==='gpt'?'block':'hidden')}><RC data={results.gpt} name="GPT-4o"/></div>
                    {(results.claude||results.gemini||results.gpt)&&<div className="bg-slate-800 text-white p-5 rounded-2xl text-center mt-4"><div className="text-xs text-slate-400 mb-1">ממוצע</div><div className="text-4xl font-black">{Math.round([results.claude?.total_score,results.gemini?.total_score,results.gpt?.total_score].filter(Boolean).reduce((a,b)=>a+b,0)/([results.claude?.total_score,results.gemini?.total_score,results.gpt?.total_score].filter(Boolean).length||1))}</div></div>}
                </div>}
            </div>
        </div>}

        {view==='martin'&&<div className="max-w-2xl mx-auto flex flex-col bg-white border-2 rounded-3xl overflow-hidden shadow-xl fi" style={{height:'calc(100vh - 140px)'}}>
            <div className="bg-orange-50 p-4 border-b font-bold text-orange-900 flex justify-between items-center"><span>&#128104;&#8205;&#9877;&#65039; ראיון קולי</span><span className="text-xs bg-orange-200 px-3 py-1 rounded-full">{uI.name}</span></div>
            {martinFB?(<div className="flex-1 overflow-y-auto p-6 bg-slate-50 sc"><h2 className="text-xl font-black mb-4 text-center">&#128202; דו"ח ועדת קבלה</h2><RC data={martinFB} name="ועדת קבלה"/><button onClick={startMartin} className="w-full mt-4 bg-slate-800 text-white py-3 rounded-xl font-bold">ראיון חדש</button></div>):(
            <Fragment>
                <div className="flex-1 overflow-y-auto p-5 space-y-4 bg-slate-50 sc">
                    {chat.length===0&&<div className="text-center text-slate-400 mt-10 space-y-2"><div className="text-4xl">&#127897;</div><div className="font-bold">מרטין מתחיל...</div></div>}
                    {chat.map((m,i)=><div key={i} className={'flex '+(m.role==='user'?'justify-end':'justify-start')}><div className={'max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed shadow-sm '+(m.role==='user'?'bg-orange-800 text-white rounded-tl-sm':'bg-white border rounded-tr-sm')}>{m.text}</div></div>)}
                    {mLd&&<div className="flex justify-start"><div className="bg-white border p-4 rounded-2xl rounded-tr-sm flex gap-2 items-center"><span className="ld"></span><span className="text-xs text-slate-400">מעבד...</span></div></div>}
                    <div ref={ceRef}/>
                </div>
                <div className="p-4 border-t flex gap-2 flex-col">
                    <button onClick={togMartinRec} disabled={mLd} className={'flex-1 py-4 rounded-2xl flex items-center justify-center gap-2 font-black transition-all '+(isMartinRec?'bg-red-500 text-white rp':'bg-orange-800 text-white hover:bg-orange-900')+' disabled:opacity-50'}>{isMartinRec?'\u23F9 \u05E2\u05E6\u05D5\u05E8 \u05D5\u05E9\u05DC\u05D7':'\uD83C\uDF99 \u05DC\u05D7\u05E5, \u05D3\u05D1\u05E8, \u05D5\u05E2\u05E6\u05D5\u05E8'}</button>
                    {chat.length>0&&<button onClick={endInterview} disabled={mLd} className="w-full py-2 text-sm font-bold text-orange-800 bg-orange-50 rounded-xl hover:bg-orange-100">סיים וקבל משוב ועדה</button>}
                </div>
            </Fragment>)}
        </div>}

        </main>
    </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
